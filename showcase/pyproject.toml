[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nasha-enterprise-showcase"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2"]
[tool.setuptools.packages.find]
include = ["showcase*"]
[tool.setuptools.package-data]
showcase = ["*.sql", "*.json"]
