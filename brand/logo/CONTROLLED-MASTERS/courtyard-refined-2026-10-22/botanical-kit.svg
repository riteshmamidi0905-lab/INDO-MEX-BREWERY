500" height="320" fill="#d9d0bd"/><path d="M910,450C880,450 865,465 855,478L770,505L730,590L790,610L810,560L810,700L1010,700L1010,560L1030,610L1090,590L1050,505L965,478C955,465 940,450 910,450Z" fill="#F3ECDD" stroke="#999" stroke-width="1.5"/><g transform="translate(910,590) scale(1.1)"><path d="M-40.96,28.68C1.10,19.01 26.00,-2.09 40.96,-28.68C10.86,-23.72 -17.48,-7.53 -40.96,28.68z" fill="#9B2447"/><line x1="-31.1" y1="21.8" x2="31.1" y2="-21.8" stroke="#F3ECDD" stroke-width="2.2" stroke-linecap="round"/></g><g transform="translate(960,555) scale(0.7)"><path d="M-40.96,-28.68C-17.48,7.53 10.86,23.72 40.96,28.68C26.00,2.09 1.10,-19.01 -40.96,-28.68z" fill="#3F5A1E"/><line x1="-31.1" y1="-21.8" x2="31.1" y2="21.8" stroke="#F3ECDD" stroke-width="2.2" stroke-linecap="round"/></g><text x="674" y="752" font-family="Inter,sans-serif" font-size="13" fill="#444">Graphic tee: botanical art only (flat concept)</text><rect x="1190" y="410" width="550" height="320" fill="#F3ECDD"/><rect x="1230" y="480" width="470" height="150" fill="#9B2447"/><g transform="translate(1260,555) scale(0.44)"><path d="M-40.96,28.68C4.97,24.54 29.16,2.41 40.96,-28.68C7.71,-28.22 -21.36,-13.06 -40.96,28.68z" fill="#F3ECDD"/></g><g transform="translate(1318,555) scale(0.44)"><path d="M-40.96,-28.68C-21.36,13.06 7.71,28.22 40.96,28.68C29.16,-2.41 4.97,-24.54 -40.96,-28.68z" fill="#F3ECDD"/></g><g transform="translate(1376,555) scale(0.44)"><path d="M-40.96,28.68C4.97,24.54 29.16,2.41 40.96,-28.68C7.71,-28.22 -21.36,-13.06 -40.96,28.68z" fill="#F3ECDD"/></g><g transform="translate(1434,555) scale(0.44)"><path d="M-40.96,-28.68C-21.36,13.06 7.71,28.22 40.96,28.68C29.16,-2.41 4.97,-24.54 -40.96,-28.68z" fill="#F3ECDD"/></g><g transform="translate(1492,555) scale(0.44)"><path d="M-40.96,28.68C4.97,24.54 29.16,2.41 40.96,-28.68C7.71,-28.22 -21.36,-13.06 -40.96,28.68z" fill="#F3ECDD"/></g><g transform="translate(1550,555) scale(0.44)"><path d="M-40.96,-28.68C-21.36,13.06 7.71,28.22 40.96,28.68C29.16,-2.41 4.97,-24.54 -40.96,-28.68z" fill="#F3ECDD"/></g><g transform="translate(1608,555) scale(0.44)"><path d="M-40.96,28.68C4.97,24.54 29.16,2.41 40.96,-28.68C7.71,-28.22 -21.36,-13.06 -40.96,28.68z" fill="#F3ECDD"/></g><g transform="translate(1666,555) scale(0.44)"><path d="M-40.96,-28.68C-21.36,13.06 7.71,28.22 40.96,28.68C29.16,-2.41 4.97,-24.54 -40.96,-28.68z" fill="#F3ECDD"/></g><text x="1206" y="752" font-family="Inter,sans-serif" font-size="13" fill="#444">Secondary packaging band (carton wrap / sleeve) — flat concept</text><text x="60" y="800" font-family="Inter,sans-serif" font-size="20" fill="#222">Rules</text><text x="60" y="834" font-family="Inter,sans-serif" font-size="16" fill="#222">• Leaf is a supporting graphic: never replaces, outlines or sits inside the NASHA wordmark or symbol.</text><text x="60" y="868" font-family="Inter,sans-serif" font-size="16" fill="#222">• The B-style leaf-crossbar wordmark is retired as a logo idea (read as slashes at small size).</text><text x="60" y="902" font-family="Inter,sans-serif" font-size="16" fill="#222">• Min 14 px / 4 mm (simplified leaf), 40 px / 12 mm for the version with a midrib.</text><text x="60" y="936" font-family="Inter,sans-serif" font-size="16" fill="#222">• Botanical subjects must be named and accurate before any caption; no 'exotic' framing. Cultural-authenticity review pending.</text></svg>