name: model-live-validation
# PROPOSED, NOT INSTALLED. Lives under docs/ so GitHub does not run it. To adopt: copy to .github/workflows/model-live.yml (a founder-authorised step), then start it by hand.
# One genuine model-backed supplier-research + recommendation workflow on a FREE local runtime (Ollama) on a GitHub-hosted runner: no API key, no paid service, no change to this sandbox's network policy.
# Precedent in this repository: .github/workflows/model-eval.yml (qwen2.5 1.5B/7B/14B on ubuntu-latest). Manual trigger only; results go to a ci-results/* branch, never main.
on:
  workflow_dispatch:
    inputs:
      model: { description: "Ollama model tag", default: "qwen2.5:7b-instruct" }
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: nasha, POSTGRES_PASSWORD: nasha, POSTGRES_DB: nasha }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nasha" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NASHA_PG_DSN: postgresql://nasha:nasha@localhost:5432/nasha
      NASHA_LIVE_MODEL_PROVIDER: ollama
      AP_OLLAMA_BASE_URL: http://localhost:11434/v1
      AP_OLLAMA_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r lab/requirements-dev.txt -r lab/requirements-ci-extras.txt
      - run: pip install 'git+https://github.com/riteshmamidi0905-lab/mcp-weir.git@5df274563a4a73ebbd31a6380e3a7d829b6bf4a2' 'git+https://github.com/riteshmamidi0905-lab/production-ai-agent-platform.git@f8ba3735204d192734d9f8db7c164efd67790a71'
      - name: Non-privileged application role (random per-run password, masked), exactly as in lab-ci
        run: |
          APP_PW="$(python -c 'import secrets; print(secrets.token_hex(24))')"; echo "::add-mask::$APP_PW"
          APP_PW="$APP_PW" python - <<'PY'
          import os, psycopg
          from psycopg import sql
          with psycopg.connect("postgresql://nasha:nasha@localhost:5432/nasha", autocommit=True) as c:
              c.execute(sql.SQL("CREATE ROLE growth_app LOGIN NOBYPASSRLS PASSWORD {}").format(sql.Literal(os.environ["APP_PW"])))
          PY
          echo "NASHA_GROWTH_APP_PASSWORD=$APP_PW" >> "$GITHUB_ENV"
      - name: Install Ollama and pull the model (public registry; free)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS localhost:11434/api/version && break || sleep 2; done
          ollama pull "${{ inputs.model }}"; ollama show "${{ inputs.model }}" | tee /tmp/model-info.txt; nproc; free -g | head -2
      - name: Live validation (real inference; the harness writes executed=true only if the live test passes)
        run: cd lab && python tools/live_model_validation.py
      - name: Publish raw results to a results branch (never main)
        if: always()
        run: |
          mkdir -p /tmp/out && cp lab/results/model-validation/live.json /tmp/model-info.txt /tmp/ollama.log /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          br="ci-results/model-live-${{ github.run_id }}"
          git checkout --orphan "$br"; git rm -rf . -q || true
          mkdir -p results && cp /tmp/out/* results/ && echo "run ${{ github.run_id }} commit ${{ github.sha }} model ${{ inputs.model }}" > results/RUN.txt
          git add results && git commit -q -m "model-live results run ${{ github.run_id }}" && git push -q origin "$br"
