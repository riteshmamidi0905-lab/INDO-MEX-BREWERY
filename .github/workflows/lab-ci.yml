name: lab-ci
on:
  push:
    paths: ["lab/**", ".github/workflows/lab-ci.yml", "docs/decisions/**", "docs/company/**"]
  pull_request:
    paths: ["lab/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: nasha, POSTGRES_PASSWORD: nasha, POSTGRES_DB: nasha }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nasha" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NASHA_PG_DSN: postgresql://nasha:nasha@localhost:5432/nasha
      NASHA_UI_PLAYWRIGHT_MANAGED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r lab/requirements-dev.txt -r lab/requirements-ci-extras.txt
      - name: Install pinned THE WEIR gateway so the real-gateway tests run instead of skipping
        run: pip install 'git+https://github.com/riteshmamidi0905-lab/mcp-weir.git@5df274563a4a73ebbd31a6380e3a7d829b6bf4a2'
      - name: Fonts the brand and plate-pipeline tests open by absolute path (Inter, DejaVu)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter fonts-dejavu-core
      - name: Create the non-privileged application role the Growth OS tests must connect as (the service container does not trust local connections)
        run: |
          APP_PW="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$APP_PW"
          APP_PW="$APP_PW" python - <<'PY'
          import os, psycopg
          from psycopg import sql
          with psycopg.connect("postgresql://nasha:nasha@localhost:5432/nasha", autocommit=True) as c:
              c.execute(sql.SQL("CREATE ROLE growth_app LOGIN NOBYPASSRLS PASSWORD {}").format(sql.Literal(os.environ["APP_PW"])))
          PY
          echo "NASHA_GROWTH_APP_PASSWORD=$APP_PW" >> "$GITHUB_ENV"
      - name: Install the pinned Production AI Agent Platform so the tests that need it run instead of skipping
        run: pip install 'git+https://github.com/riteshmamidi0905-lab/production-ai-agent-platform.git@f8ba3735204d192734d9f8db7c164efd67790a71'
      - run: python -m playwright install --with-deps chromium
      - name: Point the Growth OS browser tests at the Chromium and axe-core just installed (otherwise they skip)
        run: |
          python - >> "$GITHUB_ENV" <<'PY'
          import os, axe_playwright_python
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print("CHROMIUM_PATH=" + p.chromium.executable_path)
          print("AXE_PATH=" + os.path.join(os.path.dirname(axe_playwright_python.__file__), "axe.min.js"))
          PY
      - name: All tests (unit, data, retrieval, pgvector, API, MCP, trust boundary, LangGraph, identity, UI + accessibility, property-based, failure injection). No paid API, no key.
        run: cd lab && python -m pytest -q -p no:cacheprovider -rs --junitxml=/tmp/junit.xml tests
      - name: Skip report (report-only; flip to --strict after the first clean run)
        if: always()
        run: |
          cd lab && python tools/skip_report.py /tmp/junit.xml --md /tmp/skip-report.md | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: junit-and-skip-report, path: "/tmp/junit.xml\n/tmp/skip-report.md" }
      - name: Ops AI evaluation passes on a fresh warehouse and a rebuild is bit-identical (fails on any wrong answer, false allow, or table-hash difference)
        run: cd lab && make eval && make repro
      - name: Block-1 data-quality evaluation reproduces byte for byte
        run: cd lab && python -m nasha_lab.evaluate v1 | diff - results/eval_v1.json
      - name: Planner experiment (deterministic control + stand-in models) reproduces
        run: |
          cd lab && python -m nasha_lab.eval_planners deterministic /tmp/planner.json > /dev/null
          python -m nasha_lab.repro_check planner /tmp/planner.json results/planner_deterministic.json
      - name: Retrieval evaluation v2 reproduces (BM25 exact; SVD / neural / HNSW within 0.03)
        run: |
          cd lab && python -m nasha_lab.eval_rag2 /tmp/rag2.json > /dev/null
          python -m nasha_lab.repro_check rag2 /tmp/rag2.json results/rag2_retrieval.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and prove the API serves a ready world, the review console and an agent run to the approval gate
        run: |
          docker compose -f lab/docker-compose.yml up -d --build
          for i in $(seq 1 90); do curl -fsS localhost:8000/ready && break || sleep 3; done
          curl -fsS localhost:8000/ready | tee /tmp/ready.json
          python3 -c "import json; r=json.load(open('/tmp/ready.json')); assert r['status']=='ready' and r['orders']>3000 and r['knowledge_chunks']>500, r"
          curl -fsS localhost:8000/review | grep -q "NASHA Lab Review Console"
          RID=$(curl -fsS -X POST localhost:8000/agent/runs -H 'content-type: application/json' -d '{"event_id":"EV-C2"}' | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['awaiting_human'] and r['proposal']['abstain'], r; print(r['run']['run_id'])")
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/agent/runs/$RID/approve -H 'content-type: application/json' -d '{}')" = "401"
      - if: failure()
        run: docker compose -f lab/docker-compose.yml logs --no-color | tail -50
